name: CI

# Gates every pull request (and every push to main) with the same checks we
# run locally, so code that breaks the build or the test suites never merges.
#
# There is no frontend any more: the Tauri shell and the React app are gone and
# the UI is Rust (GPUI), so "typecheck + tests + build" is now
# "cargo check + cargo test + cargo clippy".

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs: when a new commit lands on the same PR/branch, the
# in-flight CI run is replaced instead of queuing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is the shipping target: the real DXGI / Media Foundation /
          # WASAPI engine compiles here, and the GPUI Windows backend (plus the
          # HLSL shader compilation in gpui-pre-windows' build script) is
          # exercised.
          - name: Windows · engine
            os: windows-latest
            features: ""
          # Everywhere else the engine falls back to its synthetic backend and
          # every platform module degrades to a stub, so the UI, the settings
          # model and all policy tests still compile and run.
          - name: macOS · headless-sim
            os: macos-latest
            features: "--features headless-sim"
          - name: Linux · headless-sim
            os: ubuntu-latest
            features: "--features headless-sim"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Check
        run: cargo check --all-targets ${{ matrix.features }}

      - name: Unit tests
        run: cargo test ${{ matrix.features }}

      - name: Clippy
        run: cargo clippy --all-targets ${{ matrix.features }}

      # The release profile is what ships (`opt-level = "s"`, `lto`,
      # `panic = "abort"`), and the Windows release build compiles gpui's HLSL
      # shaders, so it is checked here rather than only on a tag.
      - name: Check release profile
        run: cargo check --release ${{ matrix.features }}
